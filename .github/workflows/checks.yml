name: CPU contract checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-checks.txt
      - run: python -m pip install -r requirements-checks.txt
      - run: python -m pytest -q tests
      - run: python -m tools.verify_evidence
      - run: python -m tools.verify_study
